# Public demo: the static build (npm run build -> dist/) on GitHub Pages at
# https://pscatlabs.github.io/print-shop/. Pages source is "GitHub Actions"
# (build_type: workflow). The app uses relative URLs only, so it works under
# the /print-shop/ project path; CI's browser check serves it under the same
# prefix. dist/ includes the single-file offline edition the page links to.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Verifies the engine's provenance hash before emitting dist/.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
