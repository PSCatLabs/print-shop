name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The pscat engine is not in git (#28): install the release tarball
      # pinned in public/engine/provenance.json, verified by SHA-256.
      - uses: actions/cache@v4
        with:
          path: .engine-cache
          key: pscat-engine-${{ hashFiles('public/engine/provenance.json') }}
      - run: npm run engine:fetch
      - run: npm test
      - run: npm run build
      - run: npm run issues:publish -- --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: printshop-static-and-rendered-proofs
          path: |
            dist/
            artifacts/
