name: ci
on:
  push:
    branches: [main, feature/initial-vertical-slice]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: npm run issues:publish -- --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: printshop-static-and-rendered-proofs
          path: |
            dist/
            artifacts/
